name: Python CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      # 🔐 Dependency Security Scan (non-blocking)
      - name: Check Vulnerabilities (pip-audit)
        run: |
          pip install pip-audit
          pip-audit || true

      # 🔐 Code Security Scan (non-blocking)
      - name: Run Bandit Security Scan
        run: |
          pip install bandit
          bandit -r . -ll || true

      # 🧪 Run Tests (non-blocking)
      - name: Run Tests
        run: |
          pip install pytest
          pytest || true

      # 🔐 Secret Leak Scan
      - name: Secret Scan
        uses: zricethezav/gitleaks-action@v2
        continue-on-error: true
